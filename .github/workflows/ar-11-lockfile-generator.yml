name: AR-11 lockfile generator (temporary read-only)
on:
  push:
    branches: ['ai/chatgpt/ar-11-react-transitions-20261027']
    paths:
      - 'package.json'
      - '.github/workflows/ar-11-lockfile-generator.yml'
permissions:
  contents: read
jobs:
  verify-next-docs:
    name: Inspect installed Next.js transition docs
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify exact npm lockfile works
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print installed Next.js transition docs from node_modules
        shell: bash
        run: |
          set -euo pipefail
          echo NEXT_DOCS_BEGIN
          find node_modules/next/dist/docs -type f \( -iname '*view*transition*' -o -iname '*navigation*' -o -iname '*link*' \) | head -40
          while IFS= read -r file; do
            echo "NEXT_DOC_FILE: $file"
            sed -n '1,180p' "$file"
            echo NEXT_DOC_FILE_END
          done < <(find node_modules/next/dist/docs -type f \( -iname '*view*transition*' -o -iname '*navigation*' \) | head -15)
          echo NEXT_DOCS_END
