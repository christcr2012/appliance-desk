name: Checked testing deployment
on:
  schedule:
    # Evening testing release; that night's live release ships this version.
    - cron: '5 18 * * *'
      timezone: America/Denver
    # Backup in case the first event is missed (the daily marker stops a second build).
    - cron: '35 19 * * *'
      timezone: America/Denver
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: testing-deployment
  cancel-in-progress: false
jobs:
  promote-testing:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.actor == 'christcr2012' && github.triggering_actor == 'christcr2012'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Promote the newest fully checked main to testing only
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release/promote-testing.mjs
