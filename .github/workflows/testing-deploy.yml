name: Checked testing deployment
on:
  schedule:
    # 10 pm Denver testing release (Chris, 2026-10-24); the live release just after midnight
    # ships this version. GitHub often starts scheduled jobs late; if this lands after midnight,
    # live simply ships the previous tested version and this one goes out the next night.
    - cron: '0 22 * * *'
      timezone: America/Denver
    # Backups in case the first event is missed (the daily marker stops a second build).
    - cron: '40 22 * * *'
      timezone: America/Denver
    - cron: '20 23 * * *'
      timezone: America/Denver
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: testing-deployment
  cancel-in-progress: false
jobs:
  promote-testing:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.actor == 'christcr2012' && github.triggering_actor == 'christcr2012'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Promote the newest fully checked main to testing only
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release/promote-testing.mjs
