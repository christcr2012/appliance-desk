name: Daily live policy
on:
  schedule:
    - cron: '1 0 * * *' # 00:01 Denver year-round; GitHub may delay.
      timezone: America/Denver
    - cron: '19 0 * * *' # Backup if the top-of-hour scheduled event is dropped.
      timezone: America/Denver
    - cron: '17 1 * * *' # Second recovery window, still same Denver day.
      timezone: America/Denver
  workflow_dispatch:
    inputs:
      recovery_day:
        description: "Denver date of missed daily release (YYYY-MM-DD; owner only)"
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: daily-live-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: release-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require PRs to target main
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: test "$BASE_BRANCH" = main
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test .github/release/promote-live.test.mjs

  promote:
    name: scheduled-live-promotion
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'christcr2012')) && github.ref == 'refs/heads/main'
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Checked daily fast-forward only
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_DENVER_DAY: ${{ inputs.recovery_day }}
        run: node .github/release/promote-live.mjs
