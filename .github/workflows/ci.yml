name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appliance_desk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/appliance_desk_test
      DIRECT_URL: postgresql://test:test@localhost:5432/appliance_desk_test
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production-use-only
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Test-only login accounts, seeded ONLY into this job's throwaway
      # Postgres container (destroyed at the end of the run) — never set
      # against the real production database. This is what lets
      # e2e/accessibility-authenticated.spec.ts log in for real and check
      # /desk/** and /account/** pages, not just the public site.
      OWNER_EMAIL: ci-owner@example.test
      OWNER_PASSWORD: Ci-Test-Owner-Password-Not-Real-1!
      TEST_CUSTOMER_EMAIL: ci-customer@example.test
      TEST_CUSTOMER_PASSWORD: Ci-Test-Customer-Password-Not-Real-1!
      TEST_STAFF_EMAIL: ci-staff@example.test
      TEST_STAFF_PASSWORD: Ci-Test-Staff-Password-Not-Real-1!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for un-reviewed destructive migrations
        run: npm run check:migrations

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Verify schema health (same check production runs before building)
        run: npm run db:verify-schema-health

      - name: Prove schema health rejects a missing column (disposable database only)
        run: npx tsx scripts/test-schema-health.ts

      - name: Seed business content + test-only OWNER/CUSTOMER accounts
        run: npm run db:seed

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility & e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
