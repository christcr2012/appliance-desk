name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appliance_desk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/appliance_desk_test
      DIRECT_URL: postgresql://test:test@localhost:5432/appliance_desk_test
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production-use-only
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci
        continue-on-error: true

      - name: Show install failure details (temporary diagnostic)
        if: steps.install.outcome == 'failure'
        run: |
          LOGFILE=$(ls -t "$HOME"/.npm/_logs/*-debug-0.log | head -1)
          echo "Reading: $LOGFILE"
          echo "::group::npm debug log (full)"
          cat "$LOGFILE" || true
          echo "::endgroup::"
          wc -l "$LOGFILE"
          # Find where the ROOT package's own postinstall (prisma generate) is
          # invoked, and print a window of log lines around it — the run-script
          # summary lines alone don't include the command's actual stdout/stderr.
          START=$(grep -n "unrs-resolver.*postinstall" "$LOGFILE" | tail -1 | cut -d: -f1)
          START=${START:-1}
          RELEVANT=$(sed -n "${START},$((START+80))p" "$LOGFILE" | tr '\n' ' | ' | tr -d '\r')
          echo "::error title=npm ci failed (1/4)::${RELEVANT:0:900}"
          echo "::error title=npm ci failed (2/4)::${RELEVANT:900:900}"
          echo "::error title=npm ci failed (3/4)::${RELEVANT:1800:900}"
          echo "::error title=npm ci failed (4/4)::${RELEVANT:2700:900}"
          exit 1

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility & e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
