name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appliance_desk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/appliance_desk_test
      DIRECT_URL: postgresql://test:test@localhost:5432/appliance_desk_test
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production-use-only
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        id: build
        run: |
          npm run build > /tmp/build-output.log 2>&1
          exit $?
        continue-on-error: true

      - name: Show build failure details (temporary diagnostic)
        if: steps.build.outcome == 'failure'
        run: |
          RELEVANT=$(tail -n 120 /tmp/build-output.log | tr '\n' ' | ' | tr -d '\r')
          echo "::error title=build failed (1/5)::${RELEVANT:0:900}"
          echo "::error title=build failed (2/5)::${RELEVANT:900:900}"
          echo "::error title=build failed (3/5)::${RELEVANT:1800:900}"
          echo "::error title=build failed (4/5)::${RELEVANT:2700:900}"
          echo "::error title=build failed (5/5)::${RELEVANT:3600:900}"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility & e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
