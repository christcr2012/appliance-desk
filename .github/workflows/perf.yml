name: Performance Baselines

on:
  pull_request:
    paths:
      - "src/**"
      - "prisma/**"
      - "tests/perf/**"
      - ".github/workflows/perf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: capacity baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # The same Docker Official postgres:17 image, from its Amazon ECR Public copy: anonymous Docker Hub pulls hit a
        # rate limit on shared runners (2026-10-09, every job of #366 failed before any test ran).
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appliance_desk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d appliance_desk_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      BATCH_E_PERF: "true"
      DATABASE_URL: postgresql://test:test@localhost:5432/appliance_desk_test
      DIRECT_URL: postgresql://test:test@localhost:5432/appliance_desk_test
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production-use-only
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      OWNER_EMAIL: ci-owner@example.test
      OWNER_PASSWORD: Ci-Test-Owner-Password-Not-Real-1!
      TEST_CUSTOMER_EMAIL: ci-customer@example.test
      TEST_CUSTOMER_PASSWORD: Ci-Test-Customer-Password-Not-Real-1!
      TEST_STAFF_EMAIL: ci-staff@example.test
      TEST_STAFF_PASSWORD: Ci-Test-Staff-Password-Not-Real-1!
    steps:
      - uses: actions/checkout@v5
      - name: Node and dependencies (cached node_modules, shared with CI)
        uses: ./.github/actions/setup-deps
      - name: Apply migrations
        run: npm run db:migrate:deploy
      - name: Seed required singleton and test accounts
        run: npm run db:seed
      - name: Measure performance baselines
        # These files share one disposable PostgreSQL database. File-level
        # parallelism would make each fixture distort the other's measurement.
        run: npx vitest run tests/perf/*.test.ts --no-file-parallelism
