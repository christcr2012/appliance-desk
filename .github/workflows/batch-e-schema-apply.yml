name: Apply Batch E schema transform

on:
  push:
    branches: [ai/sol/batch-e-automation]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[batch-e-schema-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/sol/batch-e-automation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact Batch E schema edits
        run: node scripts/apply-batch-e-schema.mjs
      - name: Commit transformed files and remove bootstrap files
        shell: bash
        run: |
          rm scripts/apply-batch-e-schema.mjs .github/workflows/batch-e-schema-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src/domains/backup/manifest.ts scripts/apply-batch-e-schema.mjs .github/workflows/batch-e-schema-apply.yml
          git commit -m "WU-E1: add Batch E schema and backup coverage [batch-e-schema-applied]"
          git push origin HEAD:ai/sol/batch-e-automation
