name: Apply Batch E estimate messaging
on:
  push:
    branches: [ai/sol/batch-e-messaging]
    paths:
      - scripts/apply-batch-e-estimate-messaging.mjs
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/sol/batch-e-messaging
      - run: node scripts/apply-batch-e-estimate-messaging.mjs
      - name: Commit transformed source and remove temporary transform
        run: |
          rm scripts/apply-batch-e-estimate-messaging.mjs .github/workflows/batch-e-estimate-messaging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: route estimate messages through delivery ledger"
          git push
